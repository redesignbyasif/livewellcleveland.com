name: Retrieve original brand assets
on: push
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p originals
          curl -fL 'https://images.squarespace-cdn.com/content/v1/61e892e5ceee0115f1c816d3/1642792049699-5FIACZM14JLWDU7S2FX5/unsplash-image-LOt8O3nfZQ4.jpg?format=1500w' -o originals/hero.jpg
          curl -fL 'https://images.squarespace-cdn.com/content/v1/61e892e5ceee0115f1c816d3/1642881099267-P20RE26TOK82GV9DVUB5/unsplash-image-mzN7eMmv9IM.jpg?format=1000w' -o originals/approach.jpg
          curl -fL 'https://www.livewellcleveland.com/' -o originals/source.html
      - uses: actions/upload-artifact@v4
        with:
          name: original-assets
          path: originals
