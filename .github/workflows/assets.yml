name: Retrieve original brand assets
on:
  push:
    paths: [".github/workflows/assets.yml"]
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/images .arena/originals
          curl -fL 'https://images.squarespace-cdn.com/content/v1/61e892e5ceee0115f1c816d3/1642792049699-5FIACZM14JLWDU7S2FX5/unsplash-image-LOt8O3nfZQ4.jpg?format=1500w' -o assets/images/hero.jpg
          curl -fL 'https://images.squarespace-cdn.com/content/v1/61e892e5ceee0115f1c816d3/1642881099267-P20RE26TOK82GV9DVUB5/unsplash-image-mzN7eMmv9IM.jpg?format=1000w' -o assets/images/approach.jpg
          curl -fL 'https://www.livewellcleveland.com/' -o assets/source.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Preserve original business photography and brand source"
          git push origin HEAD:arena/b5ab21ae-livewellcleveland-com
